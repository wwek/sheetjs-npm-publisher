name: Trying to publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish (overwrite same version, e.g. to update README)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ci-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-slim

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Git checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Update npm
        run: npm install npm@$( jq '.engines.npm' -r package.json ) --global

      - name: Install dependencies
        run: npm ci

      - name: Patching
        id: patching
        env:
          FORCE_PUBLISH: ${{ github.event.inputs.force || 'false' }}
        run: npm start
        continue-on-error: true

      - name: Publish
        if: steps.patching.outcome == 'success'
        working-directory: sheetjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: npm publish --access public
